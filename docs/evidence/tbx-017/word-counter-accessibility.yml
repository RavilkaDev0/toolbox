    - region [ref=f10e73]:
      - heading "How counts are defined" [level=2] [ref=f10e74]
      - list [ref=f10e75]:
        - listitem [ref=f10e76]: "Words are locale-aware word-like segments from the browser’s `Intl.Segmenter`. If that API is unavailable, fallback counts runs of Unicode letters/numbers with combining marks and internal apostrophes; this fallback is approximate for languages such as Chinese and Japanese."
        - listitem [ref=f10e77]: "Characters with spaces count grapheme clusters (user-perceived characters), including all whitespace. Without spaces excludes grapheme clusters made only of Unicode whitespace. Browsers without `Intl.Segmenter` count Unicode code points for both."
        - listitem [ref=f10e78]: UTF-16 code units and Unicode code points are also shown because they differ from grapheme clusters for emoji and combining marks.
        - listitem [ref=f10e79]: "Lines are logical lines separated by LF, CRLF or CR; empty input has zero lines and a trailing line break adds an empty final line. Paragraphs are runs of non-empty lines separated by one or more blank/whitespace-only lines. Sentences count non-whitespace segments from `Intl.Segmenter`; fallback groups sentence-ending punctuation and counts any remaining text as one sentence."
      - paragraph [ref=f10e80]: Input is limited to 100,000 UTF-16 code units to keep analysis bounded on mobile devices. Counts are descriptive and locale/API behavior can vary by browser.
