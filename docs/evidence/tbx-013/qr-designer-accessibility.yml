      - paragraph [ref=f6e21]: QR tools · Browser-local
      - heading "QR designer" [level=1] [ref=f6e22]
      - paragraph [ref=f6e23]: Create an accessible QR code from plain text or an HTTP(S) URL. Adjust the look, add a small logo, and download a PNG or vector SVG after a local scan check.
      - paragraph [ref=f6e24]: Your text and logo stay in this browser tab. The QR is decoded locally before download; different cameras and scanning apps can still vary.
