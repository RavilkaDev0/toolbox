    - region [ref=f6e88]:
      - heading "How to make a QR code" [level=2] [ref=f6e89]
      - list [ref=f6e90]:
        - listitem [ref=f6e91]: Enter a complete HTTP or HTTPS URL, or switch to plain text.
        - listitem [ref=f6e92]: Choose a preset, size, quiet zone, contrast-safe colors and error correction.
        - listitem [ref=f6e93]: Optionally add a small PNG or JPEG logo. The tool normalizes it to a safe raster image.
        - listitem [ref=f6e94]: Wait for the PNG and vector SVG to decode back to the exact content, then download either format.
      - paragraph [ref=f6e95]: QR data is encoded with Reed–Solomon error correction. Logos and decorative module styles can reduce scan reliability; this tool blocks downloads when its independent browser scanner cannot read the exact content. It does not guarantee that every camera will scan every design. Payloads are limited to 2 KiB before the QR version and error-correction capacity are considered. Logo files must be PNG or JPEG, at most 1 MiB, 512 pixels per side and 0.25 megapixels. Animated or vector logos are not accepted.
