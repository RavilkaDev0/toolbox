    - region [ref=f7e69]:
      - heading "Share a Wi-Fi QR code" [level=2] [ref=f7e70]
      - list [ref=f7e71]:
        - listitem [ref=f7e72]: Enter the network name exactly as it appears in Wi-Fi settings.
        - listitem [ref=f7e73]: Choose the network's actual security type and enter its password if required.
        - listitem [ref=f7e74]: Mark the network hidden only when its SSID is not broadcast.
        - listitem [ref=f7e75]: Generate, check and download the code. Test it with the intended device before sharing.
      - paragraph [ref=f7e76]: Wi-Fi QR text follows a widely used device configuration format, not a universal promise of one-tap connection. WPA uses the QR type WPA for WPA/WPA2 and transition networks. WPA3-Personal uses the SAE extension, which some newer Android readers support and some other scanners may not. WEP is a legacy option. Anyone who scans the generated QR can read its network details, so share it only with people you trust.
