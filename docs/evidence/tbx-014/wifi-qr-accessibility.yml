      - heading "Wi-Fi QR code" [level=1] [ref=f7e28]
      - paragraph [ref=f7e29]: Create a Wi-Fi QR code for a secured, hidden or open network. The browser checks the generated PNG and vector SVG before offering either download.
      - paragraph [ref=f7e30]: Network details stay in this tab and are not saved or uploaded. QR connection support varies by phone, camera, scanner app and Wi-Fi security mode.
