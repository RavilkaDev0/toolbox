      - list [ref=f8e81]:
        - listitem [ref=f8e82]: Enter a full name. Organization, title, phone, email, website and address are optional.
        - listitem [ref=f8e83]: Review the live QR preview after each change; the browser verifies its decoded contact card.
        - listitem [ref=f8e84]: Download the QR image or a vCard file that can be imported into a contacts app.
        - listitem [ref=f8e85]: Test the code with the device or app where the contact will be added before sharing.
      - paragraph [ref=f8e86]: The export uses vCard 3.0 with escaped text fields and folded long lines. QR capacity and scanner support vary; no preview can guarantee import behavior in every camera or contact app. The vCard and QR contain the same personal information, so share either only with people you trust.
