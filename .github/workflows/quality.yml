name: Quality

permissions:
  contents: read

on:
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - dev
      - main

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      SITE_URL: https://toolbox.release-check.invalid
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.64.0-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-1.64.0-
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm --filter @toolbox/web exec playwright install --with-deps chromium webkit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm build
      - name: Build standalone production image
        run: docker build --build-arg SITE_URL="$SITE_URL" --tag "toolbox-web:${GITHUB_SHA}" .
      - name: Verify standalone production image and browser
        shell: bash
        run: |
          set -euo pipefail
          container_name="toolbox-web-smoke-${GITHUB_RUN_ID}"
          docker run --detach --name "$container_name" --publish 127.0.0.1:3101:3000 "toolbox-web:${GITHUB_SHA}"
          cleanup() {
            docker logs "$container_name" || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3101/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Standalone container did not become healthy." >&2
            exit 1
          fi
          docker cp apps/web/scripts/smoke-standalone.mjs "$container_name:/tmp/smoke-standalone.mjs"
          docker exec \
            --env SITE_URL="$SITE_URL" \
            --env TOOLBOX_SMOKE_URL=http://127.0.0.1:3000 \
            "$container_name" node /tmp/smoke-standalone.mjs
          TOOLBOX_SMOKE_URL=http://127.0.0.1:3101 node apps/web/scripts/smoke-standalone-browser.mjs
